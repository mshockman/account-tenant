<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Link Success!</title>

    <style>
        html {
          font-family: Arial, sans-serif;
          background-color: #000;
          color: #fff;
        }

        html, body {
          height: 100%;
          width: 100%;
          margin: 0;
          padding: 0;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
        }

        #link-success {
          background-color: #333;
          padding: 20px;
          border-radius: 5px;
          border: 2px solid darkgreen;
        }

        #link-success h1 {
          color: darkgreen;
        }
    </style>
</head>
<body>

<div id="link-success">
  <h1>You've successfully linked your account!</h1>
  <p>You can now close this window.</p>
</div>

</body>
</html>
